name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['project.zip', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -o project.zip -d proj
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Play latest APK
          files: proj/app/build/outputs/apk/debug/app-debug.apk
